<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilian Cao</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F3F4F6; --ink:#1B2430; --muted:#5B6672; --accent:#2B6CB0; --line:#DCE0E6; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  main{ text-align:center; padding:2rem; }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:1.5rem; margin:0 0 0.5rem; }
  p{ color:var(--muted); margin:0 0 1.5rem; }
  nav{ display:flex; gap:1.5rem; justify-content:center; }
  a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); font-size:0.95rem; }
  a:hover{ border-bottom-color:var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>Lilian Cao</h1>
    <p>Choisis ta langue&nbsp;/ Choose your language&nbsp;/ Elige tu idioma</p>
    <nav>
      <a href="/fr/">Français</a>
      <a href="/en/">English</a>
      <a href="/es/">Español</a>
    </nav>
  </main>
</body>
</html>
